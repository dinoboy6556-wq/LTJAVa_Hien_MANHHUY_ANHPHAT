spring.application.name=library
# Read the ignored local configuration during normal local startup.
spring.profiles.default=local

# Ket noi MySQL trong Laragon
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/library_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Keep imported dataset; opt in explicitly to built-in demo seeds.
app.seed.enabled=${APP_SEED_ENABLED:false}

app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:3000/cart}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# PayOS: secrets belong in server environment, never NEXT_PUBLIC_*
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payos.return-url=${PAYOS_RETURN_URL:http://localhost:3000/cart}
app.payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:3000/cart}

# Images are local runtime data, shared via persistent storage on deployment.
app.upload.book-covers=${BOOK_COVER_DIR:./uploads/book-covers}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

app.mail.enabled=${LIBRARY_MAIL_ENABLED:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${LIBRARY_MAIL_USERNAME:}
spring.mail.password=${LIBRARY_MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-5-mini}
