spring.application.name=library

# Ket noi MySQL trong Laragon
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/library_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Keep imported dataset; opt in explicitly to built-in demo seeds.
app.seed.enabled=${APP_SEED_ENABLED:false}

app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:3000/cart}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
