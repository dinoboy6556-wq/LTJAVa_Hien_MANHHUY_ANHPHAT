server:
  port: 8080

spring:
  application:
    name: library
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:${APP_JWT_SECRET:}}
    expiration-ms: 86400000
