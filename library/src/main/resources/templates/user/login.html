<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" th:href="@{/css/user.css}">
</head><body>
<header class="topbar"><a class="brand" th:href="@{/user}"><span class="brand-icon">▣</span><span><b>mộc.</b><small>THƯ VIỆN CỦA BẠN</small></span></a>
<nav><a th:href="@{/user}" class="nav-link">Trang chủ</a><a th:href="@{/user/books}" class="nav-link">Khám phá sách</a><a th:href="@{/user/borrowed}" class="nav-link">Sách đang mượn</a><a th:href="@{/user/history}" class="nav-link">Lịch sử</a></nav>
<div class="user-actions"><a class="login-link" th:href="@{/user/login}">Đăng nhập</a></div></header>
<main class="container">
<section class="auth-wrap"><a class="back-link" th:href="@{/user}">← Về trang chủ</a><div class="auth-card"><div class="brand auth-brand"><span class="brand-icon">▣</span><span><b>mộc.</b><small>THƯ VIỆN CỦA BẠN</small></span></div><div class="eyebrow">RẤT VUI ĐƯỢC GẶP LẠI</div><h1>Chào mừng trở lại.</h1><p class="auth-subtitle">Đăng nhập để tiếp tục hành trình đọc của bạn.</p><form id="loginForm" class="auth-form"><label>Email hoặc tên đăng nhập<input name="username" autocomplete="username" required placeholder="Nhập tài khoản"></label><label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required placeholder="Nhập mật khẩu"></label><button class="btn full-btn" type="submit">Đăng nhập <span>→</span></button><p id="authMessage" class="form-message"></p></form><p class="auth-switch">Bạn chưa có tài khoản? <a th:href="@{/user/register}">Đăng ký ngay</a></p></div></section></main><footer class="footer">mộc. <span>Đọc chậm lại, sống sâu hơn.</span></footer>
<script th:src="@{/js/user.js}"></script><script th:src="@{/js/reading-tools.js}"></script></body></html>
