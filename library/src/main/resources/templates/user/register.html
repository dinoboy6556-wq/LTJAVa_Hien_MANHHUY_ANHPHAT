<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${pageTitle} ?: 'mộc. — Thư viện của bạn'">mộc. — Thư viện của bạn</title>
<link rel="stylesheet" th:href="@{/css/user.css}">
</head><body>
<header class="topbar"><a class="brand" th:href="@{/user}"><span class="brand-icon">▣</span><span><b>mộc.</b><small>THƯ VIỆN CỦA BẠN</small></span></a>
<nav><a th:href="@{/user}" class="nav-link">Trang chủ</a><a th:href="@{/user/books}" class="nav-link">Khám phá sách</a><a th:href="@{/user/borrowed}" class="nav-link">Sách đang mượn</a><a th:href="@{/user/history}" class="nav-link">Lịch sử</a></nav>
<div class="user-actions"><a class="login-link" th:href="@{/user/login}">Đăng nhập</a></div></header>
<main class="container">
<section class="auth-wrap"><a class="back-link" th:href="@{/user}">← Về trang chủ</a><div class="auth-card"><div class="brand auth-brand"><span class="brand-icon">▣</span><span><b>mộc.</b><small>THƯ VIỆN CỦA BẠN</small></span></div><div class="eyebrow">BẮT ĐẦU HÀNH TRÌNH</div><h1>Tạo tài khoản.</h1><p class="auth-subtitle">Một góc nhỏ của riêng bạn trong thế giới sách.</p><form id="registerForm" class="auth-form"><label>Họ và tên<input name="fullName" required placeholder="Tên của bạn"></label><label>Email<input type="email" name="email" required placeholder="ban@email.com"></label><label>Tên đăng nhập<input name="username" required placeholder="Tên đăng nhập"></label><label>Mật khẩu<input type="password" name="password" minlength="6" required placeholder="Ít nhất 6 ký tự"></label><button class="btn full-btn" type="submit">Tạo tài khoản <span>→</span></button><p id="authMessage" class="form-message"></p></form><p class="auth-switch">Đã có tài khoản? <a th:href="@{/user/login}">Đăng nhập</a></p></div></section></main><footer class="footer">mộc. <span>Đọc chậm lại, sống sâu hơn.</span></footer>
<script th:src="@{/js/user.js}"></script><script th:src="@{/js/reading-tools.js}"></script></body></html>
