<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${pageTitle} ?: 'mộc. — Thư viện của bạn'">mộc. — Thư viện của bạn</title>
<link rel="stylesheet" th:href="@{/css/user.css}">
</head><body>
<header class="topbar"><a class="brand" th:href="@{/user}"><span class="brand-icon">▣</span><span><b>mộc.</b><small>THƯ VIỆN CỦA BẠN</small></span></a>
<nav><a th:href="@{/user}" class="nav-link">Trang chủ</a><a th:href="@{/user/books}" class="nav-link">Khám phá sách</a><a th:href="@{/user/borrowed}" class="nav-link">Sách đang mượn</a><a th:href="@{/user/history}" class="nav-link">Lịch sử</a></nav>
<div class="user-actions"><a class="login-link" th:href="@{/user/login}">Đăng nhập</a></div></header>
<main class="container">
<section class="page-intro"><div class="eyebrow">TÀI KHOẢN CỦA BẠN</div><h1>Hồ sơ cá nhân</h1><p>Cập nhật thông tin liên hệ để thư viện hỗ trợ bạn khi cần.</p></section>
<section class="auth-card profile-card">
<form id="profileForm" class="auth-form">
<fieldset disabled>
<label>Họ và tên<input name="fullName" autocomplete="name" maxlength="255" required></label>
<label>Email đăng nhập<input name="email" type="email" readonly></label>
<label>Số điện thoại<input name="phone" type="tel" autocomplete="tel" maxlength="30" pattern="[0-9+\(\) .\-]*" placeholder="Nhập số điện thoại"></label>
<label>Địa chỉ<textarea name="address" autocomplete="street-address" maxlength="255" placeholder="Nhập địa chỉ liên hệ"></textarea></label>
<button class="btn" type="submit">Lưu thay đổi</button>
</fieldset>
<p id="profileMessage" class="form-message" role="status" aria-live="polite">Đang tải hồ sơ...</p>
</form><h2>Đổi mật khẩu</h2><form id="changePasswordForm" class="auth-form"><label>Mật khẩu hiện tại<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>Mật khẩu mới<input name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button class="btn" type="submit">Cập nhật mật khẩu</button><p id="passwordMessage" class="form-message" role="status" aria-live="polite"></p></form></section></main><footer class="footer">mộc. <span>Đọc chậm lại, sống sâu hơn.</span></footer>
<script th:src="@{/js/user.js}"></script><script th:src="@{/js/profile.js}"></script><script th:src="@{/js/reading-tools.js}"></script><script th:src="@{/js/cart-ui.js}"></script></body></html>
