<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Thư viện online — mộc.</title><link rel="stylesheet" th:href="@{/css/user.css}"></head>
<body><header class="topbar"><a class="brand" th:href="@{/user}"><span class="brand-icon">▣</span><span><b>mộc.</b><small>THƯ VIỆN CỦA BẠN</small></span></a><nav><a th:href="@{/user}" class="nav-link">Trang chủ</a><a th:href="@{/user/books}" class="nav-link">Khám phá sách</a><a th:href="@{/user/favorites}" class="nav-link">Yêu thích</a><a th:href="@{/user/borrowed}" class="nav-link">Sách đang mượn</a><a th:href="@{/user/history}" class="nav-link">Lịch sử</a></nav><div class="user-actions"><a class="login-link" th:href="@{/user/login}">Đăng nhập</a></div></header>
<main class="container"><section class="page-intro"><h1>Thư viện online & thông tin</h1><p>Đọc sách điện tử, tin thư viện và hướng dẫn sử dụng.</p></section><div class="book-grid"><article class="book-card" th:each="item : ${entries}"><div class="book-info"><small th:text="${item.kind == 'EBOOK' ? 'SÁCH ĐIỆN TỬ' : (item.kind == 'POST' ? 'TIN THƯ VIỆN' : 'THÔNG TIN')}"></small><h2 th:text="${item.title}"></h2><a class="btn" th:href="@{/user/read/{slug}(slug=${item.slug})}">Đọc nội dung →</a></div></article></div><p th:if="${entries.isEmpty()}">Chưa có nội dung được xuất bản.</p></main><footer class="footer">mộc. <span>Đọc chậm lại, sống sâu hơn.</span></footer><script th:src="@{/js/user.js}"></script><script th:src="@{/js/reading-tools.js}"></script><script th:src="@{/js/cart-ui.js}"></script><script th:src="@{/js/library-site.js}"></script></body></html>
