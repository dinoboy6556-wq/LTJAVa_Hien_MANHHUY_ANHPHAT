<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng nhập quản trị — Mộc</title><link rel="stylesheet" href="/css/user.css"></head><body><main class="container"><section class="auth-card"><h1>Đăng nhập quản trị</h1><p>Dành cho quản trị viên và thủ thư.</p><form id="adminLoginForm" class="auth-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Đăng nhập</button><p id="loginMessage" role="status"></p></form><a th:href="${@environment.getProperty('app.frontend-url', 'http://localhost:3000')}">Về trang độc giả</a></section></main><script src="/js/admin-login.js"></script></body></html>
